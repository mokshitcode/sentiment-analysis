services:
  app:
    build: .
    container_name: sentiment-analysis-app
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: sentiment-analysis-mongodb
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
